<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AGV CHEAT SHEET</title>
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon.png">
    <style>
    :root { 
        --primary: #3b82f6; /* 세련된 블루 포인트 */
        --secondary: #60a5fa; 
        --success: #10b981; 
        --bg: #020617; /* 완전 다크한 배경 */
        --card-bg: #0f172a; /* 다크 블루 톤의 카드 배경 */
        --text-color: #f8fafc; /* 밝은 회백색 텍스트 */
        --border: #1e293b; /* 은은한 테두리 */
        --result-bg: #1e293b; /* 결과창 배경 */
    }

    html, body { height: 100%; margin: 0; padding: 0; }
    
    body { 
        font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; 
        background: var(--bg); 
        display: flex; 
        justify-content: center; 
        color: var(--text-color); 
        transition: 0.3s; 
    }
    
    .app-card { 
        width: 100%; 
        max-width: 480px; 
        min-height: 100vh; 
        background: var(--card-bg); 
        box-shadow: 0 0 30px rgba(0,0,0,0.5); 
        overflow-y: auto; 
        display: flex;        
        flex-direction: column; 
        border-radius: 0; 
        transition: 0.3s; 
    }
    
    .header { 
        background: linear-gradient(135deg, #020617 0%, #1e293b 100%); 
        color: white; 
        padding: 40px 20px 30px; 
        position: relative; 
        flex-shrink: 0; 
        border-bottom: 1px solid var(--border);
    }
    
    .lang-switch { position: absolute; top: 15px; right: 15px; display: flex; gap: 5px; }
    .lang-btn { 
        border: 1px solid rgba(255,255,255,0.2); 
        background: rgba(255,255,255,0.1); 
        color: #94a3b8; 
        padding: 5px 10px; 
        border-radius: 15px; 
        font-size: 0.8rem; 
        cursor: pointer; 
        backdrop-filter: blur(5px); 
        transition: 0.3s; 
    }
    .lang-btn.active { 
        background: var(--primary); 
        color: white; 
        border: none; 
        font-weight: bold; 
        box-shadow: 0 0 10px rgba(59, 130, 246, 0.4);
    }

    .content { padding: 30px 20px; flex: 1; display: flex; flex-direction: column; }
    
    .input-group { position: relative; margin-bottom: 20px; }
    input { 
        width: 100%; 
        padding: 15px 20px; 
        border: 2px solid var(--border); 
        border-radius: 15px; 
        font-size: 1.1rem; 
        box-sizing: border-box; 
        outline: none; 
        transition: 0.3s; 
        background: #020617; 
        color: white; 
    }
    input:focus { border-color: var(--primary); box-shadow: 0 0 15px rgba(59, 130, 246, 0.3); }
    
    .ad-banner {
        width: 100%;
        height: 80px; 
        background-color: var(--border);
        border-radius: 10px;
        margin-bottom: 20px; 
        display: flex;
        align-items: center;
        justify-content: center;
        color: #64748b;
        font-size: 0.9rem;
        border: 2px dashed #334155; 
    }

    .search-btn { 
        width: 100%; 
        padding: 25px 0; 
        background: linear-gradient(to bottom, #3b82f6, #1d4ed8); 
        color: white; 
        border: none; 
        border-radius: 15px; 
        font-size: 1.5rem; 
        font-weight: 900; 
        cursor: pointer; 
        box-shadow: 0 8px 0 #1e3a8a, 0 15px 20px rgba(0,0,0,0.4); 
        transition: all 0.1s; 
        margin-bottom: 10px;
        position: relative;
        top: 0;
        flex-shrink: 0;
    }
    .search-btn:active { 
        top: 8px; 
        box-shadow: 0 0 0 #1e3a8a, inset 0 2px 5px rgba(0,0,0,0.5); 
    }
    
    #result { 
        margin-top: 25px; 
        padding: 20px; 
        border-radius: 15px; 
        background: var(--result-bg); 
        border-left: 5px solid var(--primary); 
        min-height: 80px; 
        text-align: left; 
        line-height: 1.6; 
        font-size: 1rem; 
        animation: fadeIn 0.5s ease; 
        color: var(--text-color); 
        box-shadow: inset 0 2px 10px rgba(0,0,0,0.2);
    }
    
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

    .footer { 
        padding: 30px 20px; 
        font-size: 0.85rem; 
        color: #64748b; 
        border-top: 1px solid var(--border); 
        text-align: center; 
        margin-top: auto; 
        flex-shrink: 0; 
    }
    .footer a { color: var(--primary); text-decoration: none; font-weight: bold; margin-top: 5px; display: inline-block; }
    
    .lotto-row { 
        margin-bottom: 5px; 
        padding: 5px;       
        background: #020617; 
        border-radius: 8px; 
        box-shadow: 0 2px 5px rgba(0,0,0,0.3); 
        display: flex; 
        align-items: center; 
        justify-content: center; 
        flex-wrap: wrap; 
        gap: 3px; 
        border: 1px solid var(--border);
    }
    
    .lotto-ball { 
        width: 33px; height: 33px; 
        border-radius: 50%; 
        display: inline-flex; justify-content: center; align-items: center; 
        color: white; font-weight: bold; font-size: 1.2rem; 
        text-shadow: 1px 1px 2px rgba(0,0,0,0.8); 
        box-shadow: inset 2px 2px 5px rgba(255,255,255,0.2), inset -3px -3px 5px rgba(0,0,0,0.5), 1px 1px 3px rgba(0,0,0,0.5);
        border: 1px solid rgba(0,0,0,0.3); 
    }
    
    .plus-sign { font-weight: bold; color: #64748b; margin: 0 2px; font-size: 1rem; }
    </style>
</head>
<body>

<div class="app-card">
    <div class="header">
        <div class="lang-switch">
            <button id="btn-ko" class="lang-btn active" onclick="setLang('ko')">🇰🇷 KO</button>
            <button id="btn-en" class="lang-btn" onclick="setLang('en')">🇺🇸 EN</button>
        </div>
        <h2 id="title" style="margin:0; font-size: 1.5rem; text-shadow: 0 2px 4px rgba(0,0,0,0.5);">AGV 알람 코드 조회</h2>
        <p id="subtitle" style="margin:5px 0 0; opacity: 0.7; font-size: 0.9rem;">Smart Port Maintenance Assistant</p>
    </div>

<div class="content">
        <div class="input-group" style="margin-bottom: 20px;">
            <input type="number" id="errorCode" placeholder="코드 1~3자리 입력" onkeypress="if(event.keyCode==13) check()">
        </div>

        <div style="margin-bottom: 20px; display: flex; flex-direction: column; align-items: center; justify-content: center;">
            <script src="https://ads-partners.coupang.com/g.js"></script>
            <script>
                new PartnersCoupang.G({"id":962819,"template":"carousel","trackingCode":"AF5272609","width":"360","height":"80","tsource":""});
            </script>
            <p style="margin-top: 5px; font-size: 10px; color: #475569; text-align: center;">쿠팡 파트너스 활동 수수료를 제공받음</p>
        </div>

        <button class="search-btn" onclick="check()" id="search-text">조회하기</button>
        
        <div id="result">💡 코드를 입력하고 조회 버튼을 누르세요.</div>
    </div>

    <div class="footer">
        <span id="footer-text">오류 및 건의사항 문의</span><br>
        <a href="mailto:TOKIABUJI@NAVER.COM">📧 TOKIABUJI@NAVER.COM</a>
    </div>
</div>

<script>
    let currentLang = 'ko';

    const uiText = {
        ko: { 
            title: "AGV 알람 코드 조회", search: "조회하기", placeholder: "코드 1~3자리 입력", 
            footer: "오류 및 건의사항 문의", empty: "💡 코드를 입력해 주세요.", 
            unknown: "❌ 해당 코드를 찾을 수 없으니 다시 확인해 주세요.", 
            lottoTitle: "🎰 <b>행운의 로또 번호</b><br>" 
        },
        en: { 
            title: "AGV CHEAT SHEET", search: "SEARCH", placeholder: "Enter 1~3-digit Code", 
            footer: "Errors & Suggestions", empty: "💡 Please enter a code.", 
            unknown: "❌ Code not found. Please check and try again.", 
            lottoTitle: "🎰 <b>Euro Lucky Numbers</b><br>" 
        }
    };

    const agvData = {
        "1": { ko: "⚠️ <b>오류: 그리스 윤활 전원 공급 장치 VCU 출력 오류</b><br>✅ 조치: VCU에서 모듈로 연결되는 배선을 점검하고 시스템에 결함이나 손상이 있는지 확인하십시오. 모든 것이 정상이면 AGV를 재시작하고 반복되는 오류가 있는지 확인하십시오.", en: "⚠️ <b>Error: Grease lubrication power supply VCU output error</b><br>✅ Action: There is a diagnostics fault on the control of the power supply of the automatic grease lubriction system. Check the wiring from VCU to the module and check the system for faults or damage. If everything is OK, restart the AGV and check for recurring errors." },
        "3": { ko: "⚠️ <b>오류: E-캐비닛 도어 열림</b><br>✅ 조치: 하나 이상의 E-캐비닛 도어가 열려 있습니다.", en: "⚠️ <b>Error: Door e-cabinet open</b><br>✅ Action: One or more e-cabinet doors are opened." },
        "5": { ko: "⚠️ <b>오류: 트랙션 냉각수 레벨 너무 낮음</b><br>✅ 조치: 적절한 냉각수로 탱크를 최대 수위까지 보충하십시오.", en: "⚠️ <b>Error: Traction coolant level too low</b><br>✅ Action: The coolant level of the expansion tank for cooling the traction system is too low. Top up the tank to maximum level with suitable coolant." },
        "18": { ko: "⚠️ <b>오류: 유압 오일 레벨 낮음</b><br>✅ 조치: 유압 오일 레벨이 낮습니다. 유압 시스템의 누유 여부를 점검하십시오. 적절한 유압 오일로 탱크를 최대 수위까지 보충하십시오.", en: "⚠️ <b>Error: Hydraulic oil level low</b><br>✅ Action: The hydraulic oil level is low. Check the hydraulic system for leaks. Top up the tank to maximum level with suitable hydraulic oil." },
        "19": { ko: "⚠️ <b>오류: 유압 오일 압력 낮음</b><br>✅ 조치: 유압 시스템 압력이 너무 낮습니다. 펌프 및 인버터 기능, 누유, 어큐뮬레이터 질소 압력, 결함 있는 센서 및 밸브를 점검하십시오.", en: "⚠️ <b>Error: Hydraulic oil pressure low</b><br>✅ Action: Hydraulic system pressure is too low. Check the system for: functionality of the pump and inverter, leaks, accumulator nitrogen pressure, faulty sensors and valves." },
        "23": { ko: "⚠️ <b>오류: 유압 오일 레벨 너무 높음</b><br>✅ 조치: 최대 수위까지 오일을 비우십시오.", en: "⚠️ <b>Error: Hydraulic oil level too high</b><br>✅ Action: The hydraulic oil level is too high. Empty the tank to maximum level." },
        "24": { ko: "⚠️ <b>오류: 유압 오일 펌프 또는 인버터 오류</b><br>✅ 조치: 유압 시스템이 제때 압력을 형성하지 못합니다. 펌프 및 인버터 기능, 누유, 어큐뮬레이터를 점검하십시오.", en: "⚠️ <b>Error: Hydraulic oil pump or inverter error</b><br>✅ Action: The hydraulic system is unable to pressurise in time. Check the hydraulic system for: functionality of the pump and inverter, leaks, accumulator." },
        "25": { ko: "⚠️ <b>오류: 유압 오일 온도 높음</b><br>✅ 조치: 유체 순환과 냉각 팬의 기능을 점검하십시오.", en: "⚠️ <b>Error: Hydraulic oil temperature high</b><br>✅ Action: The hydraulic oil temperature is high. Check the fluid circulation and the functionality of the cooling fans." },
        "26": { ko: "⚠️ <b>오류: 유압 오일 온도 너무 높음</b><br>✅ 조치: 유체 순환과 냉각 팬의 기능을 점검하십시오.", en: "⚠️ <b>Error: Hydraulic oil temperature too high</b><br>✅ Action: The hydraulic oil temperature is too high. Check the fluid circulation and the functionality of the cooling fans." },
        "27": { ko: "⚠️ <b>오류: 유압 오일 리턴 필터 오염</b><br>✅ 조치: 필터를 교체하십시오.", en: "⚠️ <b>Error: Hydraulic oil return filter polluted</b><br>✅ Action: The hydraulic oil return filter is polluted. Replace the filter." },
        "28": { ko: "⚠️ <b>오류: 유압 오일 공급 필터 오염</b><br>✅ 조치: 필터를 교체하십시오.", en: "⚠️ <b>Error: Hydraulic oil supply filter polluted</b><br>✅ Action: The hydraulic oil supply filter is polluted Replace the filter." },
        "29": { ko: "⚠️ <b>오류: 범퍼 바이패스 스위치 활성</b><br>✅ 조치: 범퍼 오버라이드가 활성화되어 있어, 범퍼 센서가 작동하더라도 AGV를 최대 속도 0.1 m/s로 수동 주행할 수 있습니다.", en: "⚠️ <b>Error: Bumper bypass switch active</b><br>✅ Action: The bumper override is active which, with an activated bumper sensor, still allows manual driving with the AGV at a maximum speed of 0.1 m/s." },
        "30": { ko: "⚠️ <b>오류: 유압 오일 레벨 너무 낮음</b><br>✅ 조치: 오일 레벨이 복구될 때까지 시스템을 사용할 수 없습니다. 누유 여부를 확인하십시오. 리저버의 오일 레벨을 확인하고 적절한 오일로 보충하십시오.", en: "⚠️ <b>Error: Hydraulic oil level too low</b><br>✅ Action: The hydraulic oil level is too low. The system cannot be used until the hydraulic oil level is restored. Check the hydraulic system for leaks. Check the oil level in the reservoir and top up with suitable oil." },
        "31": { ko: "⚠️ <b>오류: 전면 좌측 범퍼 센서 눌림</b><br>✅ 조치: AGV 손상 여부를 확인하십시오. 오작동인 경우 범퍼 메커니즘과 센서 간의 조정을 확인하십시오.", en: "⚠️ <b>Error: Bumper sensor front left pressed</b><br>✅ Action: The bumper sensor front left no longer sees a suitable object. Check the AGV for damage. If this is a false report, check the adjustment of the sensor in relation to the bumper mechanism." },
        "32": { ko: "⚠️ <b>오류: 전면 우측 범퍼 센서 눌림</b><br>✅ 조치: AGV 손상 여부를 확인하십시오. 오작동인 경우 범퍼 메커니즘과 센서 간의 조정을 확인하십시오.", en: "⚠️ <b>Error: Bumper sensor front right pressed</b><br>✅ Action: The bumper sensor front right no longer sees a suitable object. Check the AGV for damage. If this is a false report, check the adjustment of the sensor in relation to the bumper mechanism." },
        "33": { ko: "⚠️ <b>오류: 후면 좌측 범퍼 센서 눌림</b><br>✅ 조치: AGV 손상 여부를 확인하십시오. 오작동인 경우 범퍼 메커니즘과 센서 간의 조정을 확인하십시오.", en: "⚠️ <b>Error: Bumper sensor rear left pressed</b><br>✅ Action: The bumper sensor rear left no longer sees a suitable object. Check the AGV for damage. If this is a false report, check the adjustment of the sensor in relation to the bumper mechanism." },
        "34": { ko: "⚠️ <b>오류: 후면 우측 범퍼 센서 눌림</b><br>✅ 조치: AGV 손상 여부를 확인하십시오. 오작동인 경우 범퍼 메커니즘과 센서 간의 조정을 확인하십시오.", en: "⚠️ <b>Error: Bumper sensor rear right pressed</b><br>✅ Action: The bumper sensor rear right no longer sees a suitable object. Check the AGV for damage. If this is a false report, check the adjustment of the sensor in relation to the bumper mechanism." },
        "35": { ko: "⚠️ <b>오류: 비상 정지 버튼(전면 좌측) 눌림</b><br>✅ 조치: 비상 정지 원인 확인 및 안전 확보 후 AGV 리셋", en: "⚠️ <b>Error: Emergency stop button front left pressed</b><br>✅ Action: The emergency stop button front left has been pressed. Check the reason for pressing the emergency stop and reset the AGV when the situation is safe again." },
        "36": { ko: "⚠️ <b>오류: 비상 정지 버튼(전면 우측) 눌림</b><br>✅ 조치: 비상 정지 원인 확인 및 안전 확보 후 AGV 리셋", en: "⚠️ <b>Error: Emergency stop button front right pressed</b><br>✅ Action: The emergency stop button front right has been pressed. Check the reason for pressing the emergency stop and reset the AGV when the situation is safe again." },
        "37": { ko: "⚠️ <b>오류: 비상 정지 버튼(중간 좌측) 눌림</b><br>✅ 조치: 비상 정지 원인 확인 및 안전 확보 후 AGV 리셋", en: "⚠️ <b>Error: Emergency stop button middle left pressed</b><br>✅ Action: The emergency stop button middle left has been pressed. Check the reason for pressing the emergency stop and reset the AGV when the situation is safe again." },
        "38": { ko: "⚠️ <b>오류: 비상 정지 버튼(중간 우측) 눌림</b><br>✅ 조치: 비상 정지 원인 확인 및 안전 확보 후 AGV 리셋", en: "⚠️ <b>Error: Emergency stop button middle right pressed</b><br>✅ Action: The emergency stop button middle right has been pressed. Check the reason for pressing the emergency stop and reset the AGV when the situation is safe again." },
        "39": { ko: "⚠️ <b>오류: 비상 정지 버튼(후방 좌측) 눌림</b><br>✅ 조치: 비상 정지 원인 확인 및 안전 확보 후 AGV 리셋", en: "⚠️ <b>Error: Emergency stop button rear left pressed</b><br>✅ Action: The emergency stop button rear left has been pressed. Check the reason for pressing the emergency stop and reset the AGV when the situation is safe again." },
        "40": { ko: "⚠️ <b>오류: 비상 정지 버튼(후방 우측) 눌림</b><br>✅ 조치: 비상 정지 원인 확인 및 안전 확보 후 AGV 리셋", en: "⚠️ <b>Error: Emergency stop button rear right pressed</b><br>✅ Action: The emergency stop button rear right has been pressed. Check the reason for pressing the emergency stop and reset the AGV when the situation is safe again." },
        "41": { ko: "⚠️ <b>오류: 비상 정지 버튼(MCD) 눌림</b><br>✅ 조치: 비상 정지 또는 플러그 제거 원인 확인 및 안전 확보 후 AGV 리셋", en: "⚠️ <b>Error: Emergency stop button MCD pressed</b><br>✅ Action: The emergency stop button MCD has been pressed or the blindplug on the side of the e-cabinet has been removed. Check the reason for pressing the emergency stop or the removal of the blindplug and reset the AGV when the situation is safe again." },
        "42": { ko: "⚠️ <b>오류: 전방 좌측 조향 밸브 제어 오류</b><br>✅ 조치: VCU와 모듈 간 배선 확인, 시스템 손상 점검 및 재시작", en: "⚠️ <b>Error: Valve steering front left error</b><br>✅ Action: There is a diagnostics fault on the control of the steering valve front left. Check the wiring from VCU to the module and check the system for faults or damage. If everything is OK, restart the AGV and check for recurring errors." },
        "43": { ko: "⚠️ <b>오류: 전방 우측 조향 밸브 제어 오류</b><br>✅ 조치: VCU와 모듈 간 배선 확인, 시스템 손상 점검 및 재시작", en: "⚠️ <b>Error: Valve steering front right error</b><br>✅ Action: There is a diagnostics fault on the control of the steering valve front right. Check the wiring from VCU to the module and check the system for faults or damage. If everything is OK, restart the AGV and check for recurring errors." },
        "44": { ko: "⚠️ <b>오류: 후방 좌측 조향 밸브 제어 오류</b><br>✅ 조치: VCU와 모듈 간 배선 확인, 시스템 손상 점검 및 재시작", en: "⚠️ <b>Error: Valve steering rear left error</b><br>✅ Action: There is a diagnostics fault on the control of the steering valve rear left. Check the wiring from VCU to the module and check the system for faults or damage. If everything is OK, restart the AGV and check for recurring errors." },
        "45": { ko: "⚠️ <b>오류: 후방 우측 조향 밸브 제어 오류</b><br>✅ 조치: VCU와 모듈 간 배선 확인, 시스템 손상 점검 및 재시작", en: "⚠️ <b>Error: Valve steering rear right error</b><br>✅ Action: There is a diagnostics fault on the control of the steering valve rear right. Check the wiring from VCU to the module and check the system for faults or damage. If everything is OK, restart the AGV and check for recurring errors." },
        "49": { ko: "⚠️ <b>오류: 내비게이션 라이선스 키 없음</b><br>✅ 조치: 유효한 라이선스 키 입력 후 AGV 재시작", en: "⚠️ <b>Error: Navigation license key not found</b><br>✅ Action: There is no license key entered in the navigation system. Automatic driving of the AGV is not allowed. Please enter a valid license key into the system and restart the AGV." },
        "50": { ko: "⚠️ <b>오류: 내비게이션 라이선스 키 유효하지 않음</b><br>✅ 조치: 유효한 라이선스 키 입력 후 AGV 재시작 또는 VDL 지원 문의", en: "⚠️ <b>Error: Navigation license key invalid</b><br>✅ Action: The license key entered in the navigation system is invalid. Automatic driving of the AGV is not allowed. Please enter a valid license key into the system and restart the AGV or contact VDL for support on this issue." },
        "51": { ko: "⚠️ <b>오류: 내비게이션 통신 카운터 오류</b><br>✅ 조치: AGV 리셋, 지속 시 CAN 버스/배선/모듈 확인", en: "⚠️ <b>Error: Communication navigation counter error</b><br>✅ Action: The CAN lifecounter of the Navigation software is not functioning as expected. Reset the AGV. If this error remains present, restart the AGV. Check the CAN bus (quality), wiring and functioning of the module." },
        "52": { ko: "⚠️ <b>오류: 전방 주행 인버터 경고</b><br>✅ 조치: 진단 도구 및 매뉴얼 참조하여 경고 분석", en: "⚠️ <b>Error: Traction inverter front warning</b><br>✅ Action: The traction inverter front transmits a warning. Refer to appropriate diagnostic tools and supplier (troubleshooting) manual for analysis on the warning and more information on this fault." },
        "53": { ko: "⚠️ <b>오류: 전방 주행 인버터 오류</b><br>✅ 조치: 진단 도구 및 매뉴얼 참조하여 오류 분석", en: "⚠️ <b>Error: Traction inverter front error</b><br>✅ Action: The traction inverter front transmits an error. Refer to appropriate diagnostic tools and supplier (troubleshooting) manual for analysis on the warning and more information on this fault." },
        "54": { ko: "⚠️ <b>오류: 후방 주행 인버터 경고</b><br>✅ 조치: 진단 도구 및 매뉴얼 참조하여 경고 분석", en: "⚠️ <b>Error: Traction inverter rear warning</b><br>✅ Action: The traction inverter rear transmits a warning. Refer to appropriate diagnostic tools and supplier (troubleshooting) manual for analysis on the warning and more information on this fault." },
        "55": { ko: "⚠️ <b>오류: 후방 주행 인버터 오류</b><br>✅ 조치: 진단 도구 및 매뉴얼 참조하여 오류 분석", en: "⚠️ <b>Error: Traction inverter rear error</b><br>✅ Action: The traction inverter rear transmits an error. Refer to appropriate diagnostic tools and supplier (troubleshooting) manual for analysis on the warning and more information on this fault." },
        "58": { ko: "⚠️ <b>오류: 양쪽 주행 인버터 오류 (주행 불가)</b><br>✅ 조치: 진단 도구 및 매뉴얼 참조하여 오류 분석", en: "⚠️ <b>Error: Traction inverter both error</b><br>✅ Action: Both traction inverters are transmitting an error. The AGV is not able to drive anymore. Refer to appropriate diagnostic tools and supplier (troubleshooting) manual for analysis on the warning and more information on this fault." },
        "61": { ko: "⚠️ <b>오류: 전방 좌측 조향 각도 엔코더 값 오류</b><br>✅ 조치: CAN 버스, 배선, 모듈, 기구적 연결 상태 및 차축 손상 점검", en: "⚠️ <b>Error: Steering angle encoder front left error</b><br>✅ Action: The steering angle encoder front left gives a different value than expected. Check CAN bus (quality), wiring, module functioning, mechanical coupling between encoder and shaft, and check the axle for damage." },
        "62": { ko: "⚠️ <b>오류: 전방 우측 조향 각도 엔코더 값 오류</b><br>✅ 조치: CAN 버스, 배선, 모듈, 기구적 연결 상태 및 차축 손상 점검", en: "⚠️ <b>Error: Steering angle encoder front right error</b><br>✅ Action: The steering angle encoder front right gives a different value than expected. Check CAN bus (quality), wiring, module functioning, mechanical coupling between encoder and shaft, and check the axle for damage." },
        "63": { ko: "⚠️ <b>오류: 후방 좌측 조향 각도 엔코더 값 오류</b><br>✅ 조치: CAN 버스, 배선, 모듈, 기구적 연결 상태 및 차축 손상 점검", en: "⚠️ <b>Error: Steering angle encoder rear left error</b><br>✅ Action: The steering angle encoder rear left gives a different value than expected. Check CAN bus (quality), wiring, module functioning, mechanical coupling between encoder and shaft, and check the axle for damage." },
        "64": { ko: "⚠️ <b>오류: 후방 우측 조향 각도 엔코더 값 오류</b><br>✅ 조치: CAN 버스, 배선, 모듈, 기구적 연결 상태 및 차축 손상 점검", en: "⚠️ <b>Error: Steering angle encoder rear right error</b><br>✅ Action: The steering angle encoder rear right gives a different value than expected. Check CAN bus (quality), wiring, module functioning, mechanical coupling between encoder and shaft, and check the axle for damage." },
        "65": { ko: "⚠️ <b>오류: 전방 좌측 속도 엔코더 값 오류</b><br>✅ 조치: 진단 도구로 엔코더 기능 점검, 샤프트 연결 및 케이블 확인", en: "⚠️ <b>Error: Speed encoder front left error</b><br>✅ Action: The front left speed encoder gives a value different than expected. Check the functionality of encoder using appropriate diagnostic tools, check the mechanical connection to the shaft and the cabling." },
        "66": { ko: "⚠️ <b>오류: 전방 우측 속도 엔코더 값 오류</b><br>✅ 조치: 진단 도구로 엔코더 기능 점검, 샤프트 연결 및 케이블 확인", en: "⚠️ <b>Error: Speed encoder front right error</b><br>✅ Action: The front right speed encoder gives a value different than expected. Check the functionality of encoder using appropriate diagnostic tools, check the mechanical connection to the shaft and the cabling." },
        "67": { ko: "⚠️ <b>오류: 후방 좌측 속도 엔코더 값 오류</b><br>✅ 조치: 진단 도구로 엔코더 기능 점검, 샤프트 연결 및 케이블 확인", en: "⚠️ <b>Error: Speed encoder rear left error</b><br>✅ Action: The rear left speed encoder gives a value different than expected. Check the functionality of encoder using appropriate diagnostic tools, check the mechanical connection to the shaft and the cabling." },
        "68": { ko: "⚠️ <b>오류: 후방 우측 속도 엔코더 값 오류</b><br>✅ 조치: 진단 도구로 엔코더 기능 점검, 샤프트 연결 및 케이블 확인", en: "⚠️ <b>Error: Speed encoder rear right error</b><br>✅ Action: The rear right speed encoder gives a value different than expected. Check the functionality of encoder using appropriate diagnostic tools, check the mechanical connection to the shaft and the cabling." },
        "79": { ko: "⚠️ <b>오류: 다중 속도 엔코더 값 오류</b><br>✅ 조치: 진단 도구로 엔코더 기능 점검 및 케이블 확인", en: "⚠️ <b>Error: Speed encoder two or more error</b><br>✅ Action: Several speed encoders give a different value than expected. Check the functionality of encoders using appropriate diagnostic tools and check cabling." },
        "80": { ko: "⚠️ <b>오류: AGV 과속 (최대 속도 초과)</b><br>✅ 조치: CAN 버스, 배선, 주행 인버터 기능 점검 및 로그 파일 수집 후 문의", en: "⚠️ <b>Error: AGV overspeed</b><br>✅ Action: The AGV is driving faster than the maximum speed. Check the CAN bus (quality), wiring and functioning of the traction inverters. Collect navigation log files and contact VDL." },
        "81": { ko: "⚠️ <b>오류: AGV 비상 정지 안정성 문제 (조향각/속도 부조화)</b><br>✅ 조치: 조향 정렬 상태 점검 및 필요시 수정", en: "⚠️ <b>Error: AGV emergency stop stability</b><br>✅ Action: The steering angle of the AGV combined with the speed resulted in an unstable situation. The AGV has made an emergency stop. Check the steering alignment of the AGV and correct it if necessary." },
        "82": { ko: "⚠️ <b>오류: MCD 비 조작 시 즉시 정지 실패</b><br>✅ 조치: CAN 버스, 배선, 주행 인버터 및 브레이크 기능 점검", en: "⚠️ <b>Error: AGV stopped by hold to run</b><br>✅ Action: The AGV did not come to a stop fast enough in manual mode after dropping speed set point of the MCD. Check the CAN bus (quality), wiring and functioning of the traction inverters and brakes." },
        "83": { ko: "⚠️ <b>오류: AGV 리포지셔닝 실패</b><br>✅ 조치: CAN 버스, 배선, 주행 인버터 및 브레이크 기능 점검", en: "⚠️ <b>Error: AGV repositioning failed</b><br>✅ Action: The AGV is unable to correct the position within tolerance at the given stopping point. Manually position the AGV at the stopping point and resume operation." },
        "84": { ko: "⚠️ <b>오류: 전방 비상 정지 버튼 눌림</b><br>✅ 조치: 눌린 버튼 확인 및 원인 파악, 안전 확보 후 리셋", en: "⚠️ <b>Error: Emergency stop button safety circuit front pressed</b><br>✅ Action: The safety circuit of the front emergency stop buttons is interrupted. Check which emergency stop has been pressed and the reason for pressing the emergency stop or why this circuit has been interrupted. Reset the AGV when the situation is safe again." },
        "85": { ko: "⚠️ <b>오류: 후방 비상 정지 버튼 눌림</b><br>✅ 조치: 눌린 버튼 확인 및 원인 파악, 안전 확보 후 리셋", en: "⚠️ <b>Error: Emergency stop button safety circuit rear pressed</b><br>✅ Action: The safety circuit of the rear emergency stop buttons is interrupted. Check which emergency stop has been pressed and the reason for pressing the emergency stop or why this circuit has been interrupted. Reset the AGV when the situation is safe again." },
        "86": { ko: "⚠️ <b>오류: 중앙 좌측 비상 정지 버튼 눌림</b><br>✅ 조치: 눌린 버튼 확인 및 원인 파악, 안전 확보 후 리셋", en: "⚠️ <b>Error: Emergency stop button safety circuit middle left pressed</b><br>✅ Action: The safety circuit of the emergency stop button centre left is interrupted. Check the reason and reset the AGV when safe." },
        "87": { ko: "⚠️ <b>오류: 중앙 우측 비상 정지 버튼 눌림</b><br>✅ 조치: 눌린 버튼 확인 및 원인 파악, 안전 확보 후 리셋", en: "⚠️ <b>Error: Emergency stop button safety circuit middle right pressed</b><br>✅ Action: The safety circuit of the emergency stop button centre right is interrupted. Check the reason and reset the AGV when safe." },
        "88": { ko: "⚠️ <b>오류: 측면 비상 정지 버튼 눌림</b><br>✅ 조치: 눌린 버튼 확인 및 원인 파악, 안전 확보 후 리셋", en: "⚠️ <b>Error: Emergency stop button safety circuit powerpack pressed</b><br>✅ Action: The safety circuit of the emergency stop button in the power pack is interrupted. Check the reason and reset the AGV when safe." },
        "89": { ko: "⚠️ <b>오류: 주행 인버터 림프 홈(Limp home) 모드 활성화</b><br>✅ 조치: 진단 도구 및 매뉴얼 참조하여 인버터 오류 분석", en: "⚠️ <b>Error: Traction inverter limp home active</b><br>✅ Action: One of the traction inverter transmits an error and is disabled. The AGV continues driving at reduced speed. Refer to diagnostic tools." },
        "90": { ko: "⚠️ <b>오류: 직선 구간 경로 이탈 과다</b><br>✅ 조치: AGV를 수동으로 경로에 복귀시키고 운행 재개", en: "⚠️ <b>Error: AGV route deviation on straight segment too large</b><br>✅ Action: The AGV deviated too far from its route on a straight segment. Manually place the AGV back on its route and re-enter operation." },
        "91": { ko: "⚠️ <b>오류: 곡선 구간 경로 이탈 과다</b><br>✅ 조치: AGV를 수동으로 경로에 복귀시키고 운행 재개", en: "⚠️ <b>Error: AGV Route deviation in bend too large</b><br>✅ Action: The AGV deviated too far from its route on a turn segment. Manually place the AGV back on its route and re-enter operation." },
        "94": { ko: "⚠️ <b>오류: 휠 직경 재보정 없이 장거리 주행</b><br>✅ 조치: HMI 버튼을 사용하여 수동 리셋 수행", en: "⚠️ <b>Error: AGV driven too far without wheel diameter recallibration</b><br>✅ Action: The AGV has been driven straight for too long without recalibrating the wheel diameter. Perform a manual reset using the corresponding button on the HMI." },
        "96": { ko: "⚠️ <b>오류: 전방 좌측 타이어 펑크 의심 (직경 계산값 낮음)</b><br>✅ 조치: 타이어 공기압 확인 및 보정 후 HMI에서 휠 직경 리셋", en: "⚠️ <b>Error: Tire front left flat</b><br>✅ Action: The calculated diameter of the tyre front left is too low. Check tyre pressure. Reset wheel diameter on HMI." },
        "97": { ko: "⚠️ <b>오류: 전방 우측 타이어 펑크 의심 (직경 계산값 낮음)</b><br>✅ 조치: 타이어 공기압 확인 및 보정 후 HMI에서 휠 직경 리셋", en: "⚠️ <b>Error: Tire front right flat</b><br>✅ Action: The calculated diameter of the tyre front right is too low. Check tyre pressure. Reset wheel diameter on HMI." },
        "98": { ko: "⚠️ <b>오류: 후방 좌측 타이어 펑크 의심 (직경 계산값 낮음)</b><br>✅ 조치: 타이어 공기압 확인 및 보정 후 HMI에서 휠 직경 리셋", en: "⚠️ <b>Error: Tire rear left flat</b><br>✅ Action: The calculated diameter of the tyre rear left is too low. Check tyre pressure. Reset wheel diameter on HMI." },
        "99": { ko: "⚠️ <b>오류: 후방 우측 타이어 펑크 의심 (직경 계산값 낮음)</b><br>✅ 조치: 타이어 공기압 확인 및 보정 후 HMI에서 휠 직경 리셋", en: "⚠️ <b>Error: Tire rear right flat</b><br>✅ Action: The calculated diameter of the tyre rear right is too low. Check tyre pressure. Reset wheel diameter on HMI." },
        "100": { ko: "⚠️ <b>오류: 전방 트랜스폰더 안테나 인식 실패 (1개 놓침)</b><br>✅ 조치: 트랜스폰더 안테나 점검", en: "⚠️ <b>Error: Transponder antenna front missed transponder</b><br>✅ Action: The front transponder antenna missed one transponder that the AGV did expect to read." },
        "101": { ko: "⚠️ <b>오류: 후방 트랜스폰더 안테나 인식 실패 (1개 놓침)</b><br>✅ 조치: 트랜스폰더 안테나 점검", en: "⚠️ <b>Error: Transponder antenna rear missed transponder</b><br>✅ Action: The rear transponder antenna missed one transponder that the AGV did expect to read." },
        "102": { ko: "⚠️ <b>오류: 전방 트랜스폰더 안테나 다수 인식 실패 (정지)</b><br>✅ 조치: AGV를 수동으로 경로에 복귀시키고 운행 재개", en: "⚠️ <b>Error: Transponder antenna front missed too many transponders</b><br>✅ Action: The front transponder antenna missed too many transponders. AGV stopped. Manually position AGV back on route." },
        "103": { ko: "⚠️ <b>오류: 후방 트랜스폰더 안테나 다수 인식 실패 (정지)</b><br>✅ 조치: AGV를 수동으로 경로에 복귀시키고 운행 재개", en: "⚠️ <b>Error: Transponder antenna rear missed too many transponders</b><br>✅ Action: The rear transponder antenna missed too many transponders. AGV stopped. Manually position AGV back on route." },
        "104": { ko: "⚠️ <b>오류: 전방 트랜스폰더 안테나 복수 인식 실패</b><br>✅ 조치: 트랜스폰더 안테나 점검", en: "⚠️ <b>Error: Transponder antenna front missed multiple transponders</b><br>✅ Action: The front transponder antenna missed multiple transponders that the AGV did expect to read." },
        "105": { ko: "⚠️ <b>오류: 후방 트랜스폰더 안테나 복수 인식 실패</b><br>✅ 조치: 트랜스폰더 안테나 점검", en: "⚠️ <b>Error: Transponder antenna rear missed multiple transponders</b><br>✅ Action: The rear transponder antenna missed multiple transponders that the AGV did expect to read." },
        "106": { ko: "⚠️ <b>오류: 전방 트랜스폰더 안테나 통신 오류</b><br>✅ 조치: CAN 버스, 배선, 모듈 기능 점검 (통신 복구 전까지 감속 주행)", en: "⚠️ <b>Error: Transponder antenna front communication error</b><br>✅ Action: Navigation detects CAN error with front antenna. AGV drives at reduced speed. Check CAN bus, wiring, and module." },
        "107": { ko: "⚠️ <b>오류: 후방 트랜스폰더 안테나 통신 오류</b><br>✅ 조치: CAN 버스, 배선, 모듈 기능 점검 (통신 복구 전까지 감속 주행)", en: "⚠️ <b>Error: Transponder antenna rear communication error</b><br>✅ Action: Navigation detects CAN error with rear antenna. AGV drives at reduced speed. Check CAN bus, wiring, and module." },
        "108": { ko: "⚠️ <b>오류: VCU 커뮤니케이션 오류</b><br>✅ 조치: AGV 리셋/재시작, CAN 버스 및 모듈 점검", en: "⚠️ <b>Error: Communication VCU counter error</b><br>✅ Action: The CAN lifecounter of the VCU is not functioning. Reset/Restart AGV. Check CAN bus and module." },
        "109": { ko: "⚠️ <b>오류: 전방 트랜스폰더 잘못된 태그 2회 연속 인식</b><br>✅ 조치: AGV 실제 위치와 인식 위치 대조 및 태그 프로그래밍 확인", en: "⚠️ <b>Error: Transponder antenna front two wrong transponders read</b><br>✅ Action: Front antenna read 2 wrong transponders in succession. Check AGV position and transponder programming." },
        "110": { ko: "⚠️ <b>오류: 후방 트랜스폰더 잘못된 태그 2회 연속 인식</b><br>✅ 조치: AGV 실제 위치와 인식 위치 대조 및 태그 프로그래밍 확인", en: "⚠️ <b>Error: Transponder antenna rear two wrong transponders read</b><br>✅ Action: Rear antenna read 2 wrong transponders in succession. Check AGV position and transponder programming." },
        "111": { ko: "⚠️ <b>오류: VCU 통신 CRC 오류</b><br>✅ 조치: AGV 리셋/재시작, CAN 버스, 배선, 모듈 점검", en: "⚠️ <b>Error: Communication VCU CRC error</b><br>✅ Action: Navigation checksum mismatch with VCU. Reset/Restart AGV. Check CAN bus and modules." },
        "112": { ko: "⚠️ <b>오류: BMS 통신 CRC 오류</b><br>✅ 조치: AGV 리셋/재시작, CAN 버스, 배선, 모듈 점검", en: "⚠️ <b>Error: Communication BMS CRC error</b><br>✅ Action: VCU checksum mismatch with BMS. Reset/Restart AGV. Check CAN bus and modules." },
        "113": { ko: "⚠️ <b>오류: 내비게이션 통신 CRC 오류</b><br>✅ 조치: AGV 리셋/재시작, CAN 버스, 배선, 모듈 점검", en: "⚠️ <b>Error: Communication navigation CRC error</b><br>✅ Action: VCU checksum mismatch with Navigation. Reset/Restart AGV. Check CAN bus and modules." },
        "114": { ko: "⚠️ <b>오류: 정차 중 도어/E-캐비닛 열림</b><br>✅ 조치: 모든 도어 닫기 및 센서 조정 확인", en: "⚠️ <b>Error: AGV standing still door e-cabinet open</b><br>✅ Action: One of the doors is open. Close all doors and check sensors." },
        "115": { ko: "⚠️ <b>오류: 속도 엔코더 회전 방향 오류</b><br>✅ 조치: 진단 도구로 엔코더 기능 및 케이블 점검", en: "⚠️ <b>Error: Speed encoder direction of rotation error</b><br>✅ Action: One of the speed encoders is rotating in the wrong direction. Check encoders and cabling." },
        "116": { ko: "⚠️ <b>오류: AGV 미끄러짐 또는 이동 거리 부족</b><br>✅ 조치: AGV 위치 및 노면 타이어 미끄러짐 확인", en: "⚠️ <b>Error: AGV slip error or less distance travelled than expected</b><br>✅ Action: AGV travelled less distance than expected. Check AGV position and tyre slippage." },
        "117": { ko: "⚠️ <b>오류: BMS 상태 오류</b><br>✅ 조치: 공급사 매뉴얼 및 진단 도구 참조", en: "⚠️ <b>Error: BMS state in error</b><br>✅ Action: BMS is in error status. Refer to supplier manual and diagnostic tools." },
        "119": { ko: "⚠️ <b>오류: 배터리 SOC(충전량) 너무 낮음</b><br>✅ 조치: 진단 도구로 배터리 확인 및 수동 충전 시도 (수동 이동 가능)", en: "⚠️ <b>Error: Battery SOC too low</b><br>✅ Action: Battery voltage too low, not charging. AGV can be moved manually. Check battery and try to charge manually." },
        "125": { ko: "⚠️ <b>오류: 전방 장애물 감지 비상 정지</b><br>✅ 조치: 전방 장애물 확인 및 제거 후 운행 재개 라이다 점검", en: "⚠️ <b>Error: Obstacle detection front emergency stop</b><br>✅ Action: Front obstacle detection detects object in emergency field. Remove object or move AGV." },
        "126": { ko: "⚠️ <b>오류: 후방 장애물 감지 비상 정지</b><br>✅ 조치: 후방 장애물 확인 및 제거 후 운행 재개 라이다 점검", en: "⚠️ <b>Error: Obstacle detection rear emergency stop</b><br>✅ Action: Rear obstacle detection detects object in emergency field. Remove object or move AGV." },
        "127": { ko: "⚠️ <b>오류: 전방 장애물 감지 (감속/정지)</b><br>✅ 조치: 경고 영역 내 장애물 감지됨 라이다 점검", en: "⚠️ <b>Error: Obstacle detection front normal stop</b><br>✅ Action: Front obstacle detection detects object in warning field. AGV brakes." },
        "128": { ko: "⚠️ <b>오류: 후방 장애물 감지 (감속/정지)</b><br>✅ 조치: 경고 영역 내 장애물 감지됨 라이다 점검", en: "⚠️ <b>Error: Obstacle detection rear normal stop</b><br>✅ Action: Rear obstacle detection detects object in warning field. AGV brakes." },
        "136": { ko: "⚠️ <b>오류: PCS 비상 정지 명령 수신</b><br>✅ 조치: FMS/PCS 시스템 확인", en: "⚠️ <b>Error: PCS emergency stop</b><br>✅ Action: FMS/PCS system sent emergency stop command." },
        "139": { ko: "⚠️ <b>오류: 전방 조향 정렬 오차 과다</b><br>✅ 조치: 조향 정렬 확인 및 기구적/HMI 보정 수행", en: "⚠️ <b>Error: Steering alignment front error or calibration error</b><br>✅ Action: Front steering angle offset too large. Check alignment and correct mechanically/HMI." },
        "140": { ko: "⚠️ <b>오류: 후방 조향 정렬 오차 과다</b><br>✅ 조치: 조향 정렬 확인 및 기구적/HMI 보정 수행", en: "⚠️ <b>Error: Steering alignment rear error or calibration error</b><br>✅ Action: Rear steering angle offset too large. Check alignment and correct mechanically/HMI." },
        "141": { ko: "⚠️ <b>오류: PCS 경로 오류 (유효하지 않음)</b><br>✅ 조치: AGV 리셋 및 새 경로 전송 요청", en: "⚠️ <b>Error: PCS route error</b><br>✅ Action: Received route from PCS marked invalid. Send reset and new route." },
        "142": { ko: "⚠️ <b>오류: PCS 정지 지점 오류 (유효하지 않음)</b><br>✅ 조치: AGV 리셋 및 새 경로 전송 요청", en: "⚠️ <b>Error: PCS stopping point error</b><br>✅ Action: Received stop point from PCS marked invalid. Send reset and new route." },
        "143": { ko: "⚠️ <b>오류: 경로 상 트랜스폰더 위치 유효하지 않음</b><br>✅ 조치: AGV를 수동으로 경로에 복귀시키고 운행 재개", en: "⚠️ <b>Error: AGV transponder position on route invalid</b><br>✅ Action: AGV position based on transponder is not valid on route. Manually place AGV on route." },
        "144": { ko: "⚠️ <b>오류: 전방 좌측 휠 오차 또는 속도계 에러</b><br>✅ 조치: 속도 엔코더 및 타이어 공기압 점검 후 HMI 리셋", en: "⚠️ <b>Error: Wheel diameter front left too large or speed encoder error</b><br>✅ Action: Front left wheel diameter too large. Check speed encoder, tyre pressure. Reset wheel diameter." },
        "145": { ko: "⚠️ <b>오류: 전방 우측 휠 오차 또는 속도계 에러</b><br>✅ 조치: 속도 엔코더 및 타이어 공기압 점검 후 HMI 리셋", en: "⚠️ <b>Error: Wheel diameter front right too large or speed encoder error</b><br>✅ Action: Front right wheel diameter too large. Check speed encoder, tyre pressure. Reset wheel diameter." },
        "146": { ko: "⚠️ <b>오류: 후방 좌측 휠 오차 또는 속도계 에러</b><br>✅ 조치: 속도 엔코더 및 타이어 공기압 점검 후 HMI 리셋", en: "⚠️ <b>Error: Wheel diameter rear left too large or speed encoder error</b><br>✅ Action: Rear left wheel diameter too large. Check speed encoder, tyre pressure. Reset wheel diameter." },
        "147": { ko: "⚠️ <b>오류: 후방 우측 휠 오차 또는 속도계 에러</b><br>✅ 조치: 속도 엔코더 및 타이어 공기압 점검 후 HMI 리셋", en: "⚠️ <b>Error: Wheel diameter rear right too large or speed encoder error</b><br>✅ Action: Rear right wheel diameter too large. Check speed encoder, tyre pressure. Reset wheel diameter." },
        "148": { ko: "⚠️ <b>오류: AGV 이동 불가 (방향 오류 또는 저속)</b><br>✅ 조치: 이동 경로 장애물 및 주행/유압 시스템 고장 확인", en: "⚠️ <b>Error: AGV does not move</b><br>✅ Action: AGV moving wrong direction or too slow. Check path for obstacles, traction, hydraulic system." },
        "149": { ko: "⚠️ <b>오류: 전방 조향 제어 오류 (각도 과다/엔코더 오류)</b><br>✅ 조치: 조향 각도 및 차축 손상 점검, CAN 버스/모듈 확인", en: "⚠️ <b>Error: Steering control front error</b><br>✅ Action: Front steering angle too large or encoder error. Check steering angle, axle, CAN bus, modules." },
        "150": { ko: "⚠️ <b>오류: 후방 조향 제어 오류 (각도 과다/엔코더 오류)</b><br>✅ 조치: 조향 각도 및 차축 손상 점검, CAN 버스/모듈 확인", en: "⚠️ <b>Error: Steering control rear error</b><br>✅ Action: Rear steering angle too large or encoder error. Check steering angle, axle, CAN bus, modules." },
        "151": { ko: "⚠️ <b>오류: 전방 조향 제어 경고 (각도 편차)</b><br>✅ 조치: 유압 시스템(펌프, 인버터, 누유, 센서 등) 점검", en: "⚠️ <b>Error: Steering control front warning</b><br>✅ Action: Deviation between desired and actual front steering angle. Check hydraulics, pump, inverter, sensors." },
        "152": { ko: "⚠️ <b>오류: 후방 조향 제어 경고 (각도 편차)</b><br>✅ 조치: 유압 시스템(펌프, 인버터, 누유, 센서 등) 점검", en: "⚠️ <b>Error: Steering control rear warning</b><br>✅ Action: Deviation between desired and actual rear steering angle. Check hydraulics, pump, inverter, sensors." },
        "155": { ko: "⚠️ <b>오류: AGV 위치 급변</b><br>✅ 조치: AGV를 수동으로 경로에 복귀시키고 운행 재개", en: "⚠️ <b>Error: AGV position jump too high</b><br>✅ Action: Position correction on odometry too large. Manually place AGV back on route." },
        "162": { ko: "⚠️ <b>오류: AGV 운행 구역 이탈</b><br>✅ 조치: AGV를 수동으로 운행 구역 내로 복귀시키고 운행 재개", en: "⚠️ <b>Error: AGV position report outside defined zone</b><br>✅ Action: AGV outside operational area. Manually place AGV back in area." },
        "164": { ko: "⚠️ <b>오류: 브레이크 해제 불가</b><br>✅ 조치: 유압 시스템 점검 및 브레이크 마모/손상 확인", en: "⚠️ <b>Error: Brakes are not released</b><br>✅ Action: Brakes cannot be released. Check hydraulic system, pump, inverter, brakes for wear." },
        "165": { ko: "⚠️ <b>오류: 전방 장애물 감지 통신 오류</b><br>✅ 조치: AGV 리셋/재시작, 이더넷 케이블 및 모듈 점검", en: "⚠️ <b>Error: Obstacle detection front communication error</b><br>✅ Action: Ethernet error with front OD. AGV reduced speed. Check cabling and module." },
        "166": { ko: "⚠️ <b>오류: 후방 장애물 감지 통신 오류</b><br>✅ 조치: AGV 리셋/재시작, 이더넷 케이블 및 모듈 점검", en: "⚠️ <b>Error: Obstacle detection rear communication error</b><br>✅ Action: Ethernet error with rear OD. AGV reduced speed. Check cabling and module." },
        "170": { ko: "⚠️ <b>오류: 전방 장애물 센서 오염 경고</b><br>✅ 조치: 센서를 적절한 세정제로 청소", en: "⚠️ <b>Error: Obstacle detection front contamination warning</b><br>✅ Action: Front sensor contaminated. Clean sensor." },
        "171": { ko: "⚠️ <b>오류: 후방 장애물 센서 오염 경고</b><br>✅ 조치: 센서를 적절한 세정제로 청소", en: "⚠️ <b>Error: Obstacle detection rear contamination warning</b><br>✅ Action: Rear sensor contaminated. Clean sensor." },
        "172": { ko: "⚠️ <b>오류: 전방 장애물 센서 장치 오류</b><br>✅ 조치: 진단 도구 및 매뉴얼 참조하여 오류 분석", en: "⚠️ <b>Error: Obstacle detection front not ok</b><br>✅ Action: Front OD device error. Refer to diagnostic tools." },
        "173": { ko: "⚠️ <b>오류: 후방 장애물 센서 장치 오류</b><br>✅ 조치: 진단 도구 및 매뉴얼 참조하여 오류 분석", en: "⚠️ <b>Error: Obstacle detection rear not ok</b><br>✅ Action: Rear OD device error. Refer to diagnostic tools." },
        "174": { ko: "⚠️ <b>오류: 전방 장애물 감지 유지보수 테스트 활성화됨</b><br>✅ 조치: 자동 모드 운행 불가, 테스트 비활성화 후 운행 재개", en: "⚠️ <b>Error: Obstacle detection front maintenance test active in auto</b><br>✅ Action: Front OD test active in auto mode. De-activate self-test." },
        "175": { ko: "⚠️ <b>오류: 후방 장애물 감지 유지보수 테스트 활성화됨</b><br>✅ 조치: 자동 모드 운행 불가, 테스트 비활성화 후 운행 재개", en: "⚠️ <b>Error: Obstacle detection rear maintenance test active in auto</b><br>✅ Action: Rear OD test active in auto mode. De-activate self-test." },
        "178": { ko: "⚠️ <b>오류: 브레이크 체결 실패</b><br>✅ 조치: 유압 시스템 점검 및 브레이크 마모/손상 확인", en: "⚠️ <b>Error: Brakes applying failed</b><br>✅ Action: Brakes cannot be applied. Check hydraulic system, pump, inverter, brakes." },
        "179": { ko: "⚠️ <b>오류: 내비게이션 파라미터 체크섬 오류</b><br>✅ 조치: AGV 리셋, 필요시 빈 파라미터 파일 업로드", en: "⚠️ <b>Error: Navigation parameter file checksum error</b><br>✅ Action: Navigation parameter checksum incorrect. Reset AGV/wheel diameter. Upload empty parameter file if needed." },
        "180": { ko: "⚠️ <b>오류: 주행 중 브레이크 체결됨</b><br>✅ 조치: 유압 시스템 점검 및 브레이크 마모/손상 확인", en: "⚠️ <b>Error: Brakes applied while driving</b><br>✅ Action: Brake pressure too low while driving. Check hydraulic system, pump, inverter, brakes." },

    function setLang(lang) {
        currentLang = lang;
        document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
        document.getElementById('btn-' + lang).classList.add('active');
        document.getElementById('title').innerText = uiText[lang].title;
        document.getElementById('search-text').innerText = uiText[lang].search;
        document.getElementById('errorCode').placeholder = uiText[lang].placeholder;
        document.getElementById('footer-text').innerText = uiText[lang].footer;
        
        const codeValue = document.getElementById('errorCode').value;
        if (codeValue) {
            check();
        } else {
            const resultDiv = document.getElementById('result');
            if(resultDiv.innerText.includes("💡") || resultDiv.innerText.includes("❌")) {
                resultDiv.innerText = uiText[lang].empty;
            }
        }
    }

    function getNumbers(count, end) {
        let nums = [];
        while (nums.length < count) {
            let r = Math.floor(Math.random() * end) + 1;
            if (!nums.includes(r)) nums.push(r);
        }
        return nums.sort((a, b) => a - b);
    }

    function getBallColor(num) {
        if (num <= 10) return "#ffd600"; 
        if (num <= 20) return "#3b82f6"; 
        if (num <= 30) return "#ef4444"; 
        if (num <= 40) return "#64748b"; 
        return "#10b981"; 
    }

    function makeBall(num, isStar = false) {
        const color = isStar ? "#f59e0b" : getBallColor(num);
        const textColor = (isStar || (!isStar && num <= 10)) ? "#1e293b" : "white";
        return `<span class="lotto-ball" style="background:${color}; color:${textColor};">${num}</span>`;
    }

    function check() {
        const codeInput = document.getElementById('errorCode');

     codeInput.blur();
     
        const code = codeInput.value;
        const resultDiv = document.getElementById('result');
        
        if (!code) { resultDiv.innerText = uiText[currentLang].empty; return; }

        if (code === "777") {
            let output = uiText[currentLang].lottoTitle;
            
            for (let i = 0; i < 5; i++) {
                output += `<div class="lotto-row">`;
                
                if (currentLang === 'ko') {
                    const nums = getNumbers(6, 45);
                    nums.forEach(n => output += makeBall(n));
                } else {
                    const mainNums = getNumbers(5, 50);
                    const starNums = getNumbers(2, 12);
                    mainNums.forEach(n => output += makeBall(n));
                    output += `<span class="plus-sign">+</span>`;
                    starNums.forEach(n => output += makeBall(n, true));
                }
                output += `</div>`;
            }
            resultDiv.innerHTML = output;

        } else if (agvData[code]) {
                        let text = agvData[code][currentLang];
            let styledText = text.replace("✅", "<br><br>✅"); 
            resultDiv.innerHTML = styledText;

        } else {
            resultDiv.innerText = uiText[currentLang].unknown;
        }
    }
</script>
